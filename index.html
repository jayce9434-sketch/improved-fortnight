function newWorld(key='backyard',customSeed=null,count=null){const s=scenarios[key]||scenarios.backyard;const seed=customSeed||s.seed;rand=mulberry32(rngSeed(seed));world={scenario:key,name:s.name,seed,month:0,year:1,cells:Array.from({length:N},()=>({terrain:0,owner:null,rightful:null,occupiedAt:0})),colonies:[],cities:[],wars:[],alliances:[],history:[],dead:[],nextColony:1,nextCity:1,nextWar:1,nextAlliance:1,totalCasualties:0,totalWars:0,totalRevolts:0,totalUnifications:0,totalMajorBattles:0,totalWarCrimes:0,econTick:0,battleFX:[],corpseFX:[],projectileFX:[],started:Date.now()};generateTerrain(s.terrain);spawnInitial(count||s.count);logEvent('world',`The colonies of <b>${s.name}</b> begin their first recorded year.`);selectedId=null;speed=1;mapMode='political';$('#mapMode').value='political';updateAllUI();closeModal('menuModal');toast('Simulation started','good');sound('start')}
function generateTerrain(type){
 const t=world.cells.map(c=>c.terrain);for(let i=0;i<N;i++)t[i]=2;
 const set=(x,y,k)=>{if(x>=0&&y>=0&&x<W&&y<H)t[idx(x,y)]=k};
 const river=(cx,width=2)=>{for(let y=0;y<H;y++){const x=Math.round(cx+Math.sin(y*.34)*4+Math.sin(y*.11)*3);for(let dx=-width;dx<=width;dx++)set(x+dx,y,5)}};
 const bridge=(x,y,len=7,vertical=false)=>{for(let k=-Math.floor(len/2);k<=Math.floor(len/2);k++)set(x+(vertical?0:k),y+(vertical?k:0),8)};
 if(type==='creek'){
   for(let i=0;i<N;i++)t[i]=rand()<.22?1:2;river(38,2);for(let y=0;y<H;y++){const x=Math.round(38+Math.sin(y*.34)*4+Math.sin(y*.11)*3);for(let dx=-4;dx<=4;dx++)if(t[idx(clamp(x+dx,0,W-1),y)]!==5)set(x+dx,y,dx<0?7:0)}
   bridge(36,9,9);bridge(40,22,9);bridge(35,34,9);blobTerrain(12,9,10,5,6);blobTerrain(62,31,10,5,1);blobTerrain(12,32,8,4,9);blobTerrain(64,8,9,4,3);
 }else if(type==='coast'){
   for(let i=0;i<N;i++){const[x,y]=xy(i);const coast=29+Math.sin(x*.17)*4+Math.sin(x*.07)*3;t[i]=y>coast+3?5:y>coast?7:(rand()<.18?1:2)}
   blobTerrain(60,35,7,4,2);blobTerrain(18,36,5,3,2);blobTerrain(67,14,7,6,6);blobTerrain(21,10,10,4,3);bridge(19,32,10,true);bridge(60,31,9,true);
 }else if(type==='yard'){
   for(let i=0;i<N;i++){const[x,y]=xy(i);t[i]=(x>56&&y>28)?4:(x<14&&y>27)?1:2}blobTerrain(13,10,10,6,1);blobTerrain(29,32,14,5,1);blobTerrain(61,10,10,6,6);blobTerrain(51,31,7,5,5);blobTerrain(49,31,9,6,7);bridge(50,31,13);blobTerrain(6,10,5,10,3);blobTerrain(37,18,6,4,9);
 }else if(type==='forest'){
   for(let i=0;i<N;i++)t[i]=rand()<.7?1:0;blobTerrain(18,18,16,3,3);blobTerrain(52,8,13,3,3);blobTerrain(58,30,14,4,3);river(38,1);bridge(38,10,7);bridge(36,29,7);blobTerrain(65,14,6,8,6);blobTerrain(8,32,7,6,9);
 }else if(type==='islands'){
   for(let i=0;i<N;i++)t[i]=5;for(const [x,y,rx,ry] of [[14,11,12,8],[37,12,10,8],[62,11,11,8],[22,32,14,7],[54,31,15,8]])blobTerrain(x,y,rx,ry,2);for(let i=0;i<N;i++)if(t[i]===2&&rand()<.22)t[i]=1;bridge(25,12,13);bridge(49,12,13);bridge(38,25,12,true);bridge(49,29,13);for(let i=0;i<N;i++)if(t[i]===2&&neigh(i).some(j=>t[j]===5))t[i]=7;
 }else if(type==='delta'){
   for(let i=0;i<N;i++)t[i]=rand()<.2?1:2;for(const cx of [20,39,58]){for(let y=0;y<H;y++){const x=Math.round(cx+Math.sin(y*.27+cx)*4);for(let dx=-1;dx<=1;dx++)set(x+dx,y,5)}}for(const [x,y] of [[20,8],[39,13],[58,9],[20,28],[39,31],[58,26]])bridge(x,y,7);for(let i=0;i<N;i++)if(t[i]!==5&&neigh(i).some(j=>t[j]===5)&&rand()<.72)t[i]=7;blobTerrain(10,34,7,5,9);blobTerrain(69,11,6,7,6);
 }else if(type==='beach'){
   for(let i=0;i<N;i++){const[x,y]=xy(i),shore=23+Math.sin(x*.16)*3+Math.sin(x*.045)*4;t[i]=y>shore+5?5:y>shore?7:(y>shore-3?9:(rand()<.16?1:2))}for(const [x,y] of [[10,30],[28,28],[48,31],[67,27]])blobTerrain(x,y,5,3,2);for(const [x,y] of [[12,25],[34,26],[58,25]])bridge(x,y,10,true);blobTerrain(17,8,11,3,3);blobTerrain(61,9,9,5,6);
 }else{
   for(let i=0;i<N;i++){const[x,y]=xy(i);t[i]=4;if(x>3&&x<W-4&&y>3&&y<H-4)t[i]=0}for(let x=0;x<W;x++)if(x%20<3)for(let y=0;y<H;y++)t[idx(x,y)]=4;for(let y=0;y<H;y++)if(y%14<2)for(let x=0;x<W;x++)t[idx(x,y)]=4;for(const [x,y] of [[10,7],[31,23],[64,34]])blobTerrain(x,y,6,4,3);for(const [x,y] of [[20,8],[40,14],[59,28]])bridge(x,y,7);blobTerrain(50,8,7,4,6);
 }
 for(let i=0;i<N;i++)world.cells[i].terrain=t[i]
}
function blobTerrain(cx,cy,rx,ry,kind){for(let y=Math.max(0,cy-ry-2);y<Math.min(H,cy+ry+3);y++)for(let x=Math.max(0,cx-rx-2);x<Math.min(W,cx+rx+3);x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<R(1.25,.62))world.cells[idx(x,y)].terrain=kind}}
function randomPassable(minDist=0,pts=[]){for(let k=0;k<1000;k++){const x=RI(W-6,3),y=RI(H-6,3),i=idx(x,y);if(!passable[world.cells[i].terrain])continue;if(pts.every(p=>Math.hypot(p.x-x,p.y-y)>=minDist))return{x,y,i}}return{x:RI(W),y:RI(H),i:0}}
function createColony(opts={}){const id=world.nextColony++,sp=opts.species||pick(species),tr=speciesTraits[sp]||{war:1,expand:1,econ:1,dip:1};const n={id,name:opts.name||`${pick(nameA)} ${pick(nameB)}`,species:sp,color:opts.color||palette[(id-1)%palette.length],alive:true,born:{year:world.year,month:world.month},died:null,killer:null,food:opts.food??R(240,100),population:opts.population??RI(15000,5000),stability:R(90,62),ce:R(1.2,.84)*tr.war,aggression:clamp(R(.95,.28)*(2-tr.dip*.55),.2,1.1),diplomacy:clamp(R(.9,.3)*tr.dip,.2,1.1),expand:tr.expand,econTrait:tr.econ,revoltSuppression:R(.8,.2),warExhaustion:0,kills:0,deaths:0,wars:0,warCrimes:0,majorWins:0,landPeak:0,liege:null,puppetType:null,autonomy:50,loyalty:70,econ:0,bonus:0,flag:null};makeFlag(n);world.colonies.push(n);return n}
function spawnInitial(count){const pts=[];for(let n=0;n<count;n++){const p=randomPassable(8,pts);pts.push(p);const c=createColony();claimBlob(c.id,p.x,p.y,RI(5,3));createCity(c.id,p.x,p.y,true);if(rand()<.55){const q=randomOwnedCell(c.id);if(q)createCity(c.id,q.x,q.y,false)}}for(let i=0;i<N;i++){if(world.cells[i].owner==null&&passable[world.cells[i].terrain]&&rand()<.11){const near=neigh(i).map(j=>world.cells[j].owner).filter(x=>x);if(near.length){const o=pick(near);world.cells[i].owner=o;world.cells[i].rightful=o}}}for(const c of world.colonies)c.landPeak=ownedCount(c.id)}
function claimBlob(id,cx,cy,r){const q=[[cx,cy,0]],seen=new Set;while(q.length){const[x,y,d]=q.shift();if(x<0||y<0||x>=W||y>=H||d>r+RI(2)||seen.has(idx(x,y)))continue;const i=idx(x,y);seen.add(i);if(!passable[world.cells[i].terrain])continue;if(Math.hypot(x-cx,y-cy)<=r+R(1.4,-.8)){world.cells[i].owner=id;world.cells[i].rightful=id;for(const j of neigh(i)){const[nx,ny]=xy(j);if(rand()<.85)q.push([nx,ny,d+1])}}}}
function createCity(owner,x,y,capital=false,name=null){const c={id:world.nextCity++,owner,x,y,name:name||`${pick(nameA)} Nest`,capital,revolt:0,coreOwner:owner};world.cities.push(c);return c}
function randomOwnedCell(id){const arr=[];for(let i=0;i<N;i++)if(world.cells[i].owner===id){const[x,y]=xy(i);arr.push({i,x,y})}return arr.length?pick(arr):null}
function centroid(id){let x=0,y=0,n=0;for(let i=0;i<N;i++)if(world.cells[i].owner===id){const p=xy(i);x+=p[0];y+=p[1];n++}return n?{x:x/n,y:y/n,n}:null}

function sound(type){if(display.volume<=0)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=type==='war'?'sawtooth':type==='impact'?'square':'triangle';o.frequency.value=type==='war'?90:type==='impact'?58:type==='start'?220:150;const v=Math.min(2,display.volume/100)*(type==='impact'?.028:.018);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.12);o.start();o.stop(audioCtx.currentTime+.13)}catch(e){}}

function terrainDef(t){return[1,1.05,.98,1.18,1.3,9,.92,.94,1.35,1.08][t]||1}

function tick(){expandColonies();world.month++;if(world.month>=12){world.month=0;world.year++}warTick();if(world.month%2===0)autoDiplomacy();if(world.month%3===0)economyTick();for(const n of aliveColonies())n.warExhaustion=Math.max(0,n.warExhaustion-.025);updateAllUI(false)}

function resize(){const r=canvas.parentElement.getBoundingClientRect();const dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);canvas._cw=r.width;canvas._ch=r.height;draw()}
function mapGeom(){const cw=canvas._cw||canvas.clientWidth,ch=canvas._ch||canvas.clientHeight;const cell=Math.min(cw/W,ch/H),ox=(cw-W*cell)/2,oy=(ch-H*cell)/2;return{cell,ox,oy}}

function cellColor(c,i){const n=colony(c.owner);if(!passable[c.terrain]&&mapMode!=='terrain')return terrainColors[c.terrain];if(mapMode==='terrain')return terrainColors[c.terrain];if(!n)return colorMix(terrainColors[c.terrain],-12);if(mapMode==='political'){const a=allianceFor(n.id);return a?.union?colorBlend(n.color,a.color,.34):n.color;}if(mapMode==='rightful'){const r=colony(c.rightful);return r?.color||'#39362d'}if(mapMode==='alliances'){const a=allianceFor(n.id);return a?a.color:colorMix(n.color,-25)}if(mapMode==='wars'){const w=world.wars.find(w=>w.active&&warHas(w,n.id));if(!w)return'#4a473e';const k=(w.id*53)%360,isA=(w.attackers||[w.a]).includes(n.id);return `hsl(${k} 48% ${isA?50:33}%)`}if(mapMode==='economy'){const v=clamp((n.econ+10)/20,0,1);return `rgb(${Math.floor(130*(1-v)+50)},${Math.floor(70+90*v)},${Math.floor(45+35*v)})`}if(mapMode==='revolt'){const city=nearestCity(i,n.id);const v=city?clamp(city.revolt/100,0,1):0;return `rgb(${Math.floor(70+130*v)},${Math.floor(92-45*v)},55)`}return n.color}
function nearestCity(i,id){const[x,y]=xy(i);let best=null,bd=999;for(const c of world.cities)if(c.owner===id){const d=Math.abs(c.x-x)+Math.abs(c.y-y);if(d<bd){bd=d;best=c}}return best}
function drawStripe(x,y,s){ctx.save();ctx.beginPath();ctx.rect(x,y,s,s);ctx.clip();ctx.strokeStyle='#10100b88';ctx.lineWidth=Math.max(1,s*.18);for(let k=-s;k<s*2;k+=Math.max(4,s*.5)){ctx.beginPath();ctx.moveTo(x+k,y+s);ctx.lineTo(x+k+s,y);ctx.stroke()}ctx.restore()}
function drawBorders(cell,ox,oy){ctx.lineWidth=Math.max(1,cell*.15);ctx.strokeStyle='#13110de0';ctx.beginPath();for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y),o=world.cells[i].owner;if(x<W-1&&o!==world.cells[i+1].owner){const px=ox+(x+1)*cell,py=oy+y*cell;ctx.moveTo(px,py);ctx.lineTo(px,py+cell)}if(y<H-1&&o!==world.cells[i+W].owner){const px=ox+x*cell,py=oy+(y+1)*cell;ctx.moveTo(px,py);ctx.lineTo(px+cell,py)}}ctx.stroke()}
function drawTerrainDetail(cell,ox,oy){if(cell<4)return;const now=performance.now()/900;ctx.save();ctx.lineWidth=Math.max(.6,cell*.07);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y),t=world.cells[i].terrain,px=ox+x*cell,py=oy+y*cell;if(t===5){ctx.strokeStyle='#8bc0cb55';const wave=(Math.sin(now+x*.7+y*.2)+1)*.2*cell;ctx.beginPath();ctx.moveTo(px+cell*.1,py+cell*.45+wave);ctx.lineTo(px+cell*.9,py+cell*.45-wave);ctx.stroke()}else if(t===7&&cell>6){ctx.fillStyle='#e0c89635';ctx.fillRect(px+((x*7+y*3)%7)/7*cell,py+((y*5+x)%7)/7*cell,Math.max(1,cell*.1),Math.max(1,cell*.1))}else if(t===8){ctx.strokeStyle='#34291ba8';for(let k=.2;k<1;k+=.28){ctx.beginPath();ctx.moveTo(px+cell*.08,py+cell*k);ctx.lineTo(px+cell*.92,py+cell*k);ctx.stroke()}ctx.strokeStyle='#b8a47a88';ctx.strokeRect(px+cell*.08,py+cell*.08,cell*.84,cell*.84)}else if(t===3){ctx.strokeStyle='#2e2117aa';ctx.beginPath();ctx.moveTo(px,py+cell*.35);ctx.lineTo(px+cell,py+cell*.5);ctx.stroke()}else if(t===4&&cell>6){ctx.strokeStyle='#29292588';ctx.beginPath();ctx.moveTo(px+cell*.15,py+cell*.2);ctx.lineTo(px+cell*.55,py+cell*.62);ctx.lineTo(px+cell*.82,py+cell*.42);ctx.stroke()}}ctx.restore()}
function drawActiveFronts(cell,ox,oy){const now=performance.now()/260;ctx.save();ctx.lineCap='round';for(const w of world.wars.filter(w=>w.active)){const pairs=warBorderPairs(w);ctx.strokeStyle=w.phase==='Breakthrough'?'#f0b24dcc':w.phase==='Full offensive'?'#d7834fbb':'#d7c6a47a';ctx.lineWidth=clamp(cell*.16,1.1,3.2);ctx.beginPath();for(let p=0;p<pairs.length;p+=Math.max(1,Math.floor(pairs.length/90))){const[a,b]=pairs[p],A=xy(a),B=xy(b),mx=ox+((A[0]+B[0])/2+.5)*cell,my=oy+((A[1]+B[1])/2+.5)*cell;const flick=Math.sin(now+p+w.id)*cell*.04;ctx.moveTo(mx-cell*.15,my+flick);ctx.lineTo(mx+cell*.15,my-flick)}ctx.stroke()}ctx.restore()}
function drawCities(cell,ox,oy){for(const c of world.cities){const n=colony(c.owner);if(!n?.alive)continue;const x=ox+(c.x+.5)*cell,y=oy+(c.y+.5)*cell,r=Math.max(2.3,cell*.28);ctx.fillStyle=c.capital?'#efe2b5':'#e0d5bd';ctx.strokeStyle='#211b14';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();if(c.capital){ctx.beginPath();ctx.arc(x,y,r+2,0,Math.PI*2);ctx.strokeStyle='#e2bd6d';ctx.stroke()}if(cell>10){ctx.font=`${Math.max(7,cell*.5)}px ui-monospace`;ctx.fillStyle='#f0e8d8';ctx.textAlign='left';ctx.shadowColor='#000';ctx.shadowBlur=2;ctx.fillText(c.name,x+r+2,y+3);ctx.shadowBlur=0}}
}
function drawLabels(cell,ox,oy){const unionDrawn=new Set;for(const n of aliveColonies()){const c=centroid(n.id);if(!c||c.n<3)continue;const a=allianceFor(n.id);if(a?.union&&a.members.length>1){if(unionDrawn.has(a.id))continue;unionDrawn.add(a.id);let sx=0,sy=0,tot=0;for(const id of a.members){const cc=centroid(id);if(cc){sx+=cc.x*cc.n;sy+=cc.y*cc.n;tot+=cc.n}}if(!tot)continue;const x=ox+(sx/tot+.5)*cell,y=oy+(sy/tot+.5)*cell,size=clamp(Math.sqrt(tot)*cell*.3,10,30);ctx.save();ctx.font=`900 ${size}px ui-monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=.88;ctx.lineWidth=Math.max(2,size*.15);ctx.strokeStyle='#000b';ctx.fillStyle='#ffe1a0';ctx.strokeText(a.name.toUpperCase(),x,y);ctx.fillText(a.name.toUpperCase(),x,y);ctx.restore();continue}const x=ox+(c.x+.5)*cell,y=oy+(c.y+.5)*cell,size=clamp(Math.sqrt(c.n)*cell*.36,8,26);ctx.save();ctx.font=`900 ${size}px ui-monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=.72;ctx.lineWidth=Math.max(2,size*.13);ctx.strokeStyle='#0009';ctx.fillStyle='#f3ead6';if(display.curved&&c.n>24&&n.name.length<24){drawCurvedText(n.name.toUpperCase(),x,y,size,c.n*cell*.45)}else{ctx.strokeText(n.name.toUpperCase(),x,y);ctx.fillText(n.name.toUpperCase(),x,y)}ctx.restore()}}
function drawCurvedText(text,cx,cy,size,width){const chars=[...text],step=Math.min(size*.72,width/Math.max(1,chars.length)),total=(chars.length-1)*step;ctx.save();ctx.translate(cx-total/2,cy);for(let i=0;i<chars.length;i++){const dx=i*step-total/2,ang=(dx/Math.max(1,total))*0.35,yy=-Math.cos((i/(chars.length-1||1))*Math.PI)*size*.18;ctx.save();ctx.translate(i*step,yy);ctx.rotate(ang);ctx.strokeText(chars[i],0,0);ctx.fillText(chars[i],0,0);ctx.restore()}ctx.restore()}
function drawUnits(cell,ox,oy){if(cell<3)return;const time=performance.now()/280;for(const w of world.wars.filter(w=>w.active)){const pairs=warBorderPairs(w);if(!pairs.length)continue;const step=Math.max(1,Math.floor(5/display.unitDensity));for(let p=0;p<pairs.length;p+=step){if((p+w.id)%2)continue;const [a,b]=pairs[p],A=xy(a),B=xy(b),oa=world.cells[a].owner,ob=world.cells[b].owner,na=colony(oa),nb=colony(ob);if(!na||!nb)continue;for(let u=0;u<(w.phase==='Breakthrough'?3:2);u++){const t=(Math.sin(time+p*1.7+u*2.1)+1)/2,x=ox+(A[0]*(1-t)+B[0]*t+.5)*cell+(u-1)*cell*.1,y=oy+(A[1]*(1-t)+B[1]*t+.5)*cell;ctx.fillStyle=u%2?na.color:nb.color;ctx.strokeStyle='#110e0a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,clamp(cell*.15,1.2,3),0,Math.PI*2);ctx.fill();ctx.stroke()}}}}
function drawBattleFX(cell,ox,oy){const now=performance.now();world.battleFX=world.battleFX||[];world.projectileFX=world.projectileFX||[];world.corpseFX=world.corpseFX||[];world.battleFX=world.battleFX.filter(f=>now-f.born<1250);for(const f of world.battleFX){const[x,y]=xy(f.i),age=(now-f.born)/1250,t=clamp(age,0,1),cx=ox+(x+.5)*cell,cy=oy+(y+.5)*cell,r=cell*(f.major?2.3:.9)*(0.45+t);ctx.save();ctx.globalAlpha=(1-t)*.9;ctx.strokeStyle=f.major?'#ffc56f':'#fff0b0';ctx.fillStyle=f.major?'#d86f37':'#f3d675';ctx.lineWidth=f.major?3:1.4;ctx.beginPath();ctx.arc(cx,cy,r*.35,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();if(f.major){ctx.fillStyle='#2b2621aa';ctx.beginPath();ctx.arc(cx+cell*.32,cy-cell*.22,r*.42,0,Math.PI*2);ctx.fill()}ctx.restore()}world.projectileFX=world.projectileFX.filter(f=>now-f.born<780);for(const f of world.projectileFX){const age=now-f.born;if(age<0)continue;const[x,y]=xy(f.i),t=clamp(age/780,0,1),cx=ox+(x+.5)*cell,cy=oy+(y+.5)*cell,ang=f.seed*2.3,dist=cell*(.15+t*.7);ctx.save();ctx.globalAlpha=(1-t)*.95;ctx.strokeStyle=f.major?'#ffd084':'#fff4bf';ctx.lineWidth=f.major?2.2:1.2;ctx.beginPath();ctx.moveTo(cx-Math.cos(ang)*dist*.35,cy-Math.sin(ang)*dist*.35);ctx.lineTo(cx+Math.cos(ang)*dist,cy+Math.sin(ang)*dist);ctx.stroke();ctx.fillStyle='#fff7cf';ctx.beginPath();ctx.arc(cx,cy,Math.max(1,cell*(f.major?.15:.09))*(1-t*.5),0,Math.PI*2);ctx.fill();ctx.restore()}if(display.casualtyMarks){world.corpseFX=world.corpseFX.filter(f=>now-f.born<4600);for(const f of world.corpseFX){const age=now-f.born;if(age<0)continue;const[x,y]=xy(f.i),t=clamp(age/4600,0,1),cx=ox+(x+.25+(f.seed%1)*.5)*cell,cy=oy+(y+.25+((f.seed*.37)%1)*.5)*cell;ctx.save();ctx.globalAlpha=(1-t)*.55;ctx.fillStyle='#1a1310';ctx.beginPath();ctx.ellipse(cx,cy,Math.max(.7,cell*.09),Math.max(.5,cell*.055),f.seed,0,Math.PI*2);ctx.fill();ctx.restore()}}}
function drawFlagPattern(g,n,x,y,w,h){const f=makeFlag(n),flip=w<0;if(flip){x=x+w;w=-w}const tmp=document.createElement('canvas');tmp.width=72;tmp.height=48;const tg=tmp.getContext('2d');paintFlagBase(tg,f,n,72,48);if(!f.cells||f.showEmblem){const ex=f.emblemPos===1?23:f.emblemPos===2?49:36;drawInsectEmblem(tg,f.emblem||speciesKind(n.species),ex,24,23,f.emblemColor||'#efe3c3',colorMix(n.color,-65));}g.save();g.beginPath();const wave=performance.now()/260;g.moveTo(x,y);for(let i=0;i<=8;i++){const xx=x+w*i/8,yy=y+Math.sin(wave+i*.8)*h*.07;g.lineTo(xx,yy)}for(let i=8;i>=0;i--){const xx=x+w*i/8,yy=y+h+Math.sin(wave+i*.8+.5)*h*.07;g.lineTo(xx,yy)}g.closePath();g.clip();g.imageSmoothingEnabled=false;for(let i=0;i<12;i++){const sx=72*i/12,dx=x+w*i/12,dy=y+Math.sin(wave+i*.7)*h*.07;g.drawImage(tmp,sx,0,72/12+1,48,dx,dy,w/12+1,h)}g.restore();g.strokeStyle='#100d09';g.lineWidth=1;g.strokeRect(x+.5,y+.5,w-1,h-1)}
function drawWarFlags(cell,ox,oy){if(!display.warFlags||cell<4)return;const time=performance.now()/650;for(const w of world.wars.filter(w=>w.active)){const pairs=warBorderPairs(w);if(!pairs.length)continue;const count=Math.min(w.phase==='Breakthrough'?7:w.phase==='Full offensive'?5:4,Math.max(1,Math.floor(pairs.length/7)));for(let q=0;q<count;q++){const pair=pairs[(Math.floor(time*1.7+w.id*11+q*pairs.length/count))%pairs.length],[ia,ib]=pair,A=xy(ia),B=xy(ib),na=colony(world.cells[ia].owner),nb=colony(world.cells[ib].owner);if(!na||!nb)continue;const ax=ox+(A[0]+.5)*cell,ay=oy+(A[1]+.5)*cell,bx=ox+(B[0]+.5)*cell,by=oy+(B[1]+.5)*cell,fw=clamp(cell*1.8*display.flagSize,10,34),fh=fw*.62,pole=clamp(cell*1.1*display.flagSize,8,25),wave=Math.sin(time*3+w.id+q)*1.3;for(const item of [[ax,ay,na,-1],[bx,by,nb,1]]){const[x,y,n,side]=item,px=x+side*cell*.22,py=y;ctx.strokeStyle='#211a10';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(px,py+pole*.5);ctx.lineTo(px,py-pole*.5);ctx.stroke();drawFlagPattern(ctx,n,px,py-pole*.46+wave,fw*side,fh)}}}}

function canvasDown(e){if(!world)return;const p=screenToCell(e.clientX,e.clientY);if(!p)return;if(interaction){applyTool(p,e);return}const owner=world.cells[p.i].owner;selectedId=owner;updateNationPanel();if(innerWidth<720&&owner)$('#left').classList.add('open')}
function applyTool(p,e){if(interaction.type==='spawn'){if(!passable[world.cells[p.i].terrain])return toast('Cannot spawn a colony on impassable terrain.');const c=createColony();claimBlob(c.id,p.x,p.y,brush);createCity(c.id,p.x,p.y,true);selectedId=c.id;logEvent('world',`God Mode created <b>${c.name}</b>.`);interaction=null;updateAllUI();openGod();return}if(interaction.type==='paint'){paintCircle(p.x,p.y,brush,i=>{if(editorOwnerLayer)world.cells[i].owner=selectedId;if(editorRightfulLayer)world.cells[i].rightful=selectedId});updateAllUI(false);return}if(interaction.type==='erase'){paintCircle(p.x,p.y,brush,i=>{if(editorOwnerLayer)world.cells[i].owner=null;if(editorRightfulLayer)world.cells[i].rightful=null});updateAllUI(false);return}if(interaction.type==='terrain'){paintCircle(p.x,p.y,brush,i=>{world.cells[i].terrain=selectedTerrain;if(!passable[selectedTerrain]){world.cells[i].owner=null;world.cells[i].rightful=null}});updateAllUI(false);return}if(interaction.type==='city'){if(!selectedId)return toast('Select a colony first.');if(world.cells[p.i].owner!==selectedId)return toast('Place nests inside selected colony territory.');createCity(selectedId,p.x,p.y,false);interaction=null;updateAllUI();openGod();return}if(interaction.type==='battle'){const o=world.cells[p.i].owner;if(!o)return;const w=world.wars.find(w=>w.active&&(w.a===o||w.b===o)&&borderPairs(w.a,w.b).some(([a,b])=>a===p.i||b===p.i||neigh(a).includes(p.i)||neigh(b).includes(p.i)));if(!w)return toast('Major battles must be placed near an active frontline.');battleWar(w,true,selectedId&&[w.a,w.b].includes(selectedId)?selectedId:null);interaction=null;updateAllUI();openGod();return}}
function paintCircle(cx,cy,r,fn){for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(x>=0&&y>=0&&x<W&&y<H&&Math.hypot(x-cx,y-cy)<=r)fn(idx(x,y))}
canvas.addEventListener('pointerdown',canvasDown);canvas.addEventListener('pointermove',e=>{if(interaction?.type==='battle'){interaction.hover=screenToCell(e.clientX,e.clientY);draw()}if(e.buttons&&interaction&&['paint','erase','terrain'].includes(interaction.type)){const p=screenToCell(e.clientX,e.clientY);if(p)applyTool(p,e)}});window.addEventListener('resize',resize);

function updateHistory(){const h=$('#history');h.innerHTML=world.history.slice(0,70).map(e=>`<div class="event ${e.type}"><b>Y${e.year}.${String(e.month+1).padStart(2,'0')}</b> ${e.text}</div>`).join('')||'<div class="empty">History has not begun.</div>'}
function updateWars(){const ws=world.wars.filter(w=>w.active);$('#warstrip').innerHTML=ws.length?ws.map(w=>{const A=colony(w.a),B=colony(w.b),score=clamp(w.score,-25,25),left=score>=0?50:50+score*2,width=Math.abs(score)*2,ac=Math.max(0,(w.attackers||[w.a]).filter(id=>colony(id)?.alive).length-1),dc=Math.max(0,(w.defenders||[w.b]).filter(id=>colony(id)?.alive).length-1);return`<div class="warcard" data-war="${w.id}"><div class="warHead"><canvas class="warflag a" data-flag="${w.a}"></canvas><strong>${htmlEscape(A?.name||'Dead')}${ac?` +${ac}`:''}<br>VS<br>${htmlEscape(B?.name||'Dead')}${dc?` +${dc}`:''}</strong><canvas class="warflag b" data-flag="${w.b}"></canvas></div><div style="text-align:center;margin-top:3px;color:#c4b28d">${htmlEscape(w.phase||'Border fighting')} | ${formatNum(w.casA+w.casB)} dead</div><div class="warMeta"><span>${w.battles} battles</span><span>${w.major||0} major</span><span>${(w.crimesA||0)+(w.crimesB||0)} crimes</span></div><div class="warbar"><i></i><span style="left:${left}%;width:${width}%"></span></div></div>`}).join(''):'<div class="empty">No active wars.</div>';$$('.warflag').forEach(c=>{const n=colony(+c.dataset.flag);if(n)drawFlag(c,n,36,24)});$$('.warcard').forEach(el=>el.onclick=()=>{const w=world.wars.find(x=>x.id==el.dataset.war);if(w)openWar(w)})}

function drawScenarioPreviews(){document.querySelectorAll('[data-preview]').forEach(c=>{const g=c.getContext('2d'),key=c.dataset.preview,s=scenarios[key],rr=mulberry32(rngSeed(s.seed));g.fillStyle='#294955';g.fillRect(0,0,320,160);for(let y=0;y<20;y++)for(let x=0;x<40;x++){let col='#4e563d';if(key==='creek'){const rv=20+Math.sin(y*.5)*3;col=Math.abs(x-rv)<2?'#294955':Math.abs(x-rv)<4?'#a48a61':rr()<.18?'#51452f':'#4e563d'}else if(key==='coast')col=y>13+Math.sin(x*.3)*2?'#294955':y>11+Math.sin(x*.3)*2?'#a48a61':'#4e563d';else if(key==='forest')col=rr()<.75?'#51452f':'#4c4b35';else if(key==='islands')col=((x-9)**2/55+(y-6)**2/24<1||(x-29)**2/65+(y-7)**2/25<1||(x-20)**2/95+(y-16)**2/18<1)?'#4e563d':'#294955';else if(key==='delta'){const r1=Math.abs(x-(10+Math.sin(y*.5)*2))<1.5,r2=Math.abs(x-(20+Math.sin(y*.4)*2))<1.5,r3=Math.abs(x-(30+Math.sin(y*.55)*2))<1.5;col=(r1||r2||r3)?'#294955':'#4e563d'}else if(key==='beach')col=y>11+Math.sin(x*.3)*2?'#294955':y>8+Math.sin(x*.3)*2?'#a48a61':'#4e563d';else if(key==='kitchen')col=(x%10<2||y%7<1)?'#64635d':'#665241';else if(key==='backyard'&&x>29&&y>14)col='#5d5e58';g.fillStyle=col;g.fillRect(x*8,y*8,8,8)}for(let i=0;i<s.count;i++){g.fillStyle=palette[i%palette.length];g.beginPath();g.arc(RIpreview(rr,300,20),RIpreview(rr,140,20),RIpreview(rr,18,7),0,Math.PI*2);g.fill()}})}function RIpreview(r,a,b){return Math.floor(b+r()*(a-b))}

function openFlag(n){
  const baseColors=[n.color,colorMix(n.color,46),colorMix(n.color,-42)];
  const presets=Array.from({length:12},(_,i)=>({type:(i*5+(n.id||1)*3)%18,colors:i%4===0?[baseColors[0],'#efe2bd','#1e1d19']:i%4===1?[colorMix(n.color,-20),baseColors[1],'#d0a95a']:i%4===2?[baseColors[0],'#1e1d19','#efe2bd']:[baseColors[1],baseColors[0],colorMix(n.color,-55)],cells:null,emblem:speciesKind(n.species),emblemColor:i%3===0?'#efe2bd':flagContrast(i%2?baseColors[0]:baseColors[1]),emblemPos:i%3,showEmblem:true}));

  function ensureCells(){if(!f.cells){const tmp=document.createElement('canvas');tmp.width=12;tmp.height=8;const g=tmp.getContext('2d');g.imageSmoothingEnabled=false;paintFlagBase(g,f,n,12,8);const d=g.getImageData(0,0,12,8).data;f.cells=[];for(let i=0;i<96;i++){const r=d[i*4],gg=d[i*4+1],b=d[i*4+2];f.cells.push('#'+[r,gg,b].map(v=>v.toString(16).padStart(2,'0')).join(''))}}}
  ensureCells(); let paint=f.colors?.[0]||n.color;
  $('#flagContent').innerHTML=`<div class="modalTop"><h1>FLAG WORKSHOP</h1><span class="spacer"></span><button class="close" data-close="flagModal">Close</button></div><p><b>${htmlEscape(n.name)}</b> | ${htmlEscape(n.species)} banners automatically use a ${htmlEscape(speciesKind(n.species))} emblem.</p><h2>Species Banner Premades</h2><div id="flagPresetGrid">${presets.map((_,i)=>`<button class="flagPreset" data-preset="${i}"><canvas width="96" height="64"></canvas><small>Banner ${String(i+1).padStart(2,'0')}</small></button>`).join('')}</div><h2>Custom 12 x 8 Painter</h2><div id="flagPainter">${f.cells.map((c,i)=>`<button class="flagCell" data-i="${i}" style="background:${c}"></button>`).join('')}</div><h2>Palette</h2><div class="palette">${[n.color,'#efe2bd','#1e1d19','#9c4d43','#47759a','#7b8f4c','#c08e3c','#765894'].map((c,i)=>`<button class="swatch ${i===0?'active':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div><div class="inline" style="margin-top:10px"><label style="display:flex;gap:5px;align-items:center"><input id="emblemToggle" type="checkbox" ${f.showEmblem!==false?'checked':''}> Keep species emblem</label><button id="clearFlag">Fill</button><button id="randomPreset">Random Premade</button><button id="saveFlag" class="good">Save Flag</button></div>`;
  bindClose();
  $$('.flagPreset').forEach((b,i)=>{const c=b.querySelector('canvas'),g=c.getContext('2d'),pf=presets[i];paintFlagBase(g,pf,n,96,64);const ex=pf.emblemPos===1?30:pf.emblemPos===2?66:48;drawInsectEmblem(g,pf.emblem,ex,32,28,pf.emblemColor,colorMix(n.color,-65));b.onclick=()=>{selectedPreset=i;f=JSON.parse(JSON.stringify(pf));$$('.flagPreset').forEach(x=>x.classList.toggle('active',x===b));const demo=document.createElement('canvas');demo.width=12;demo.height=8;const dg=demo.getContext('2d');paintFlagBase(dg,f,n,12,8);const d=dg.getImageData(0,0,12,8).data;f.cells=[];$$('.flagCell').forEach((cell,j)=>{const r=d[j*4],gg=d[j*4+1],bb=d[j*4+2],cc='#'+[r,gg,bb].map(v=>v.toString(16).padStart(2,'0')).join('');f.cells[j]=cc;cell.style.background=cc});f.showEmblem=true;$('#emblemToggle').checked=true}});
  $$('.swatch').forEach(s=>s.onclick=()=>{paint=s.dataset.color;$$('.swatch').forEach(x=>x.classList.toggle('active',x===s))});
  $$('.flagCell').forEach(c=>{const apply=()=>{f.cells=f.cells||Array(96).fill(n.color);f.cells[+c.dataset.i]=paint;c.style.background=paint;selectedPreset=-1;$$('.flagPreset').forEach(x=>x.classList.remove('active'))};c.onpointerdown=apply;c.onpointerenter=e=>{if(e.buttons)apply()}});
  $('#emblemToggle').onchange=e=>f.showEmblem=e.target.checked;
  $('#clearFlag').onclick=()=>{$$('.flagCell').forEach(c=>{f.cells[+c.dataset.i]=paint;c.style.background=paint});selectedPreset=-1;$$('.flagPreset').forEach(x=>x.classList.remove('active'))};
  $('#randomPreset').onclick=()=>$$('.flagPreset')[RI(12)].click();
  $('#saveFlag').onclick=()=>{if(selectedPreset>=0){const chosen=JSON.parse(JSON.stringify(presets[selectedPreset]));chosen.showEmblem=$('#emblemToggle').checked;n.flag=chosen}else{f.showEmblem=$('#emblemToggle').checked;n.flag=f}closeModal('flagModal');updateNationPanel();updateWars();draw()};
  showModal('flagModal')
}
function openOwner(){const body=ownerUnlocked?ownerToolsHTML():`<div id="ownerLock"><p>The owner panel is locked. Enter the project owner code to continue.</p><input class="codeInput" id="ownerCode" type="password" autocomplete="off"><button id="unlockOwner" style="width:100%">Unlock</button><div id="ownerErr" class="empty" style="margin-top:8px"></div></div>`;$('#ownerContent').innerHTML=`<div class="modalTop"><h1>OWNER PANEL</h1><span class="spacer"></span><button class="close" data-close="ownerModal">Close</button></div>${body}`;bindClose();if(!ownerUnlocked){$('#unlockOwner').onclick=()=>{if($('#ownerCode').value==='WestvirgiNA'){ownerUnlocked=true;openOwner()}else $('#ownerErr').textContent='Incorrect owner code.'}}else bindOwnerActions();showModal('ownerModal')}
function ownerToolsHTML(){return`<p>Owner-only controls. These can heavily alter or reset a simulation.</p><div class="toolGrid"><button id="ownerBoost">Boost Selected Colony</button><button id="ownerPeace">End All Wars</button><button id="ownerChaos">Start Border Wars</button><button id="ownerStorm">Frontline Storm</button><button id="ownerReveal">Set All Revolts 90%</button><button id="ownerSave">Export World</button><button id="ownerReset" class="danger">Reset Simulation</button></div>`}
function bindOwnerActions(){if(!world){$('#ownerContent').insertAdjacentHTML('beforeend','<p>Start a world to use simulation controls.</p>');return}$('#ownerBoost').onclick=()=>{const n=colony(selectedId);if(n){n.food+=2500;n.population+=50000;n.stability=100;n.ce=2.2;toast('Selected colony boosted.','good');updateAllUI()}};$('#ownerPeace').onclick=()=>{for(const w of world.wars.filter(w=>w.active))makePeace(w,'Owner command ended the conflict.');updateAllUI()};$('#ownerChaos').onclick=()=>{for(const a of aliveColonies())for(const b of adjacentColonies(a.id))if(a.id<b&&rand()<.32)declareWar(a.id,b,true);updateAllUI()};$('#ownerStorm').onclick=()=>{for(const w of world.wars.filter(w=>w.active))for(let k=0;k<12;k++)battleWar(w,k%6===0);updateAllUI()};$('#ownerReveal').onclick=()=>{world.cities.forEach(c=>c.revolt=90);updateAllUI()};$('#ownerSave').onclick=exportWorld;$('#ownerReset').onclick=()=>{if(confirm('Reset the current world?'))newWorld(world.scenario,world.seed,scenarios[world.scenario]?.count||10)}}

function saveWorld(){if(!world)return;if(storageSet('chitinConflictSave',JSON.stringify({world,display})))toast('World saved locally.','good');else toast('Local saves are unavailable in this browser context.')}
function loadWorld(){try{const d=JSON.parse(storageGet('chitinConflictSave'));if(!d?.world)throw 0;world=d.world;display={...display,...d.display};rand=mulberry32(rngSeed(world.seed+'-'+world.year));selectedId=null;speed=1;closeModal('menuModal');updateAllUI();toast('Saved world loaded.','good')}catch(e){toast('No valid saved world found.')}}
function exportWorld(){if(!world)return;const blob=new Blob([JSON.stringify({version:1,world,display},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`chitin-conflict-${world.name.toLowerCase().replace(/\s+/g,'-')}-y${world.year}.json`;a.click();URL.revokeObjectURL(a.href)}
function importWorld(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);world=d.world;display={...display,...d.display};rand=mulberry32(rngSeed(world.seed+'-'+world.year));selectedId=null;speed=1;closeModal('menuModal');updateAllUI();toast('World imported.','good')}catch(e){toast('Invalid world file.')}};r.readAsText(file)}

function showModal(id){$('#'+id).classList.add('show')}function closeModal(id){$('#'+id).classList.remove('show');interaction=null;$('#mapHint').textContent='Tap territory to inspect a colony.'}function bindClose(){$$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close))}
$('#godBtn').onclick=openGod;$('#statsBtn').onclick=openStats;$('#displayBtn').onclick=openDisplay;$('#saveBtn').onclick=saveWorld;$('#menuBtn').onclick=openMenu;$('#mapMode').onchange=e=>{mapMode=e.target.value;updateTop();draw()};$$('#speedControls button').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;$$('#speedControls button').forEach(x=>x.classList.toggle('active',x===b))});$('#leftToggle').onclick=()=>$('#left').classList.toggle('open');$('#rightToggle').onclick=()=>$('#right').classList.toggle('open');

function loop(now){const dt=Math.min(100,now-lastFrame);lastFrame=now;if(world&&speed>0&&!document.hidden){simAcc+=dt*speed;while(simAcc>520){tick();simAcc-=520}}draw();requestAnimationFrame(loop)}
renderMenu();resize();
function applyTestView(t){if(t==='stats')openStats();if(t==='god')openGod();if(t==='display')openDisplay();if(t==='wars'){$('#mapMode').value='wars';mapMode='wars';updateAllUI()}if(t==='rightful'){$('#mapMode').value='rightful';mapMode='rightful';updateAllUI()}const b=$('#debugBanner');if(t){b.textContent='TEST VIEW: '+t.toUpperCase();b.style.display='block'}}
if(queries.get('snapshot')){newWorld(queries.get('scenario')||'backyard','screenshot-seed',11);for(let i=0;i<95;i++)tick();speed=0;$$('#speedControls button').forEach(b=>b.classList.toggle('active',+b.dataset.speed===0));applyTestView(queries.get('test'));draw()}else{requestAnimationFrame(loop);if(queries.get('autostart'))setTimeout(()=>{newWorld(queries.get('scenario')||'backyard','screenshot-seed',11);speed=8;setTimeout(()=>{speed=0;applyTestView(queries.get('test'))},4200)},150)}
})();
</script>
